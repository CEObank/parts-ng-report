<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Excellence - Parts NG Report System</title>
<style>
  :root {
    --primary: #05726c;
    --primary-dark: #04524c;
    --danger: #e05252;
    --warn: #e0a852;
    --gray: #8a8a8a;
    --bg: #f3faf8;
    --card: #ffffff;
    --border: #d7ece7;
    --text: #1f2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Noto Sans Thai", "Noto Sans SC", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header.topbar { background: var(--primary); color: white; }
  .topbar-inner {
    max-width: 1150px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .brand { font-weight: 600; font-size: 1.05rem; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab-btn {
    background: rgba(255,255,255,0.15);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .tab-btn.active { background: white; color: var(--primary); font-weight: 600; }

  .container { max-width: 1150px; margin: 0 auto; padding: 24px 20px 60px; }
  .view { display: none; }
  .view.active { display: block; }

  h1 { font-size: 1.4rem; margin-bottom: 16px; }
  h2 { font-size: 1.1rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-full { grid-column: 1 / -1; }
  label { font-size: 0.85rem; font-weight: 600; color: #444; }
  input, select, textarea {
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 16px; /* >=16px avoids iOS Safari zooming in on focus */
    font-family: inherit;
  }
  textarea { resize: vertical; }
  input[readonly] { background: #f3f4f6; color: #555; cursor: not-allowed; }
  select:disabled { background: #f3f4f6; color: #555; cursor: not-allowed; }

  .btn { border: none; border-radius: 6px; padding: 10px 18px; font-size: 0.95rem; cursor: pointer; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: #eef1f6; color: var(--text); }
  .btn-secondary:hover { background: #e2e6ee; }
  .btn-danger { background: #fdecec; color: #b3261e; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .file-label { display: inline-flex; align-items: center; }

  .camera-box { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  #video, #preview { width: 100%; max-width: 420px; border-radius: 8px; background: #000; }
  .camera-controls { display: flex; gap: 10px; flex-wrap: wrap; }
  .hint { font-size: 0.8rem; color: #777; margin: 0; }

  .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 0.9rem; display: none; }
  .flash-success { background: #e5f6e8; color: #1c7a34; border: 1px solid #bfe8c8; }
  .flash-error { background: #fdecec; color: #b3261e; border: 1px solid #f6c6c4; }

  .date-filter { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .grand-total { margin-left: auto; font-size: 0.9rem; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }

  .line-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .line-card { text-align: center; }
  .line-card h3 { margin: 0 0 8px; font-size: 1rem; }
  .line-total { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
  .line-total span { font-size: 0.9rem; font-weight: 400; color: #777; }
  .line-count { font-size: 0.85rem; color: #777; margin-bottom: 10px; }
  .status-breakdown { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 0.75rem; color: white; }
  .badge-ng { background: var(--danger); }
  .badge-rework { background: var(--warn); }
  .badge-other { background: var(--gray); }

  .bar-chart { display: flex; align-items: flex-end; gap: 22px; height: 220px; padding: 10px 10px 0; }
  .bar-col { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: flex-end; }
  .bar-stack { width: 100%; max-width: 60px; display: flex; flex-direction: column-reverse; border-radius: 4px 4px 0 0; overflow: hidden; }
  .bar-seg { width: 100%; }
  .bar-label { margin-top: 8px; font-size: 0.78rem; text-align: center; color: #555; }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { background: #f8f9fb; }
  .empty { text-align: center; color: #999; }
  .thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; cursor: pointer; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    align-items: center; justify-content: center; z-index: 50;
  }
  .modal-overlay.active { display: flex; }
  .modal-overlay img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }

  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 380px; }
  .login-title { font-size: 1.15rem; text-align: center; margin: 0 0 16px; }
  .login-card h2 { font-size: 1rem; margin: 0 0 12px; }
  .login-card .field { margin-bottom: 12px; }
  .switch-link { font-size: 0.85rem; text-align: center; margin-top: 12px; }
  .switch-link a { color: var(--primary); cursor: pointer; text-decoration: underline; }

  .user-info { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }

  .lang-switcher { display: flex; gap: 4px; }
  .lang-btn {
    background: rgba(255,255,255,0.15); color: white; border: none;
    padding: 5px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer;
  }
  .lang-btn.active { background: white; color: var(--primary); font-weight: 600; }
  .lang-switcher-light .lang-btn { background: #eef1f6; color: var(--text); }
  .lang-switcher-light .lang-btn.active { background: var(--primary); color: white; }
  .login-lang-row { display: flex; justify-content: center; margin-bottom: 14px; }

  .login-logo { display: block; margin: 0 auto 6px; max-width: 220px; height: auto; }
  .login-company { display: block; text-align: center; font-size: 0.85rem; font-weight: 600; color: var(--primary); margin: 0 0 18px; }
  .logo-chip { background: #ffffff; border-radius: 6px; padding: 4px 8px; display: flex; align-items: center; }
  .topbar-logo { height: 28px; width: auto; display: block; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
  .brand-title { font-weight: 600; font-size: 1rem; }
  .brand-company { font-size: 0.72rem; font-weight: 400; opacity: 0.9; }

  @media (max-width: 640px) {
    .container { padding: 16px 14px 50px; }
    .card { padding: 16px; }
    h1 { font-size: 1.2rem; }
    h2 { font-size: 1rem; }

    .form-grid { grid-template-columns: 1fr; }

    .topbar-inner { flex-direction: column; align-items: stretch; gap: 10px; padding: 10px 14px; }
    .brand { width: 100%; }
    .brand-title { font-size: 0.85rem; }
    .brand-company { font-size: 0.68rem; }
    .logo-chip { flex-shrink: 0; }
    .topbar-logo { height: 24px; }

    /* Scroll the tab bar horizontally instead of wrapping it into a messy multi-row block. */
    .tabs { width: 100%; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
    .tab-btn { flex: 0 0 auto; white-space: nowrap; }

    .user-info { width: 100%; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

    .login-wrap { padding: 14px; }
    .login-logo { max-width: 160px; }

    .date-filter { flex-direction: column; align-items: stretch; }
    .grand-total, .toolbar { margin-left: 0; }
    .toolbar { width: 100%; }
    .toolbar .btn, .toolbar .file-label { flex: 1 1 auto; justify-content: center; }

    .line-cards { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .line-total { font-size: 1.5rem; }

    /* Let the chart scroll on its own rather than force the whole page wider. */
    .bar-chart { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
    .bar-col { min-width: 56px; }

    .camera-controls .btn, .camera-controls .file-label { flex: 1 1 45%; justify-content: center; }

    table { font-size: 0.8rem; }
    .thumb { width: 40px; height: 40px; }
  }
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-card card">
    <div class="login-lang-row">
      <div class="lang-switcher lang-switcher-light">
        <button type="button" class="lang-btn" data-lang="th">ไทย</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="zh">中文</button>
      </div>
    </div>
    <img id="logoLogin" class="login-logo" src="" alt="Baojie Electric Motor (Thailand) logo">
    <span class="login-company">Baojie Electric Motor (Thailand)</span>
    <h1 class="login-title" data-i18n="appTitleShort"></h1>

    <div id="loginForm">
      <h2 data-i18n="loginHeading"></h2>
      <div class="field"><label data-i18n="usernameLabel"></label><input type="text" id="loginUsername" autocomplete="username"></div>
      <div class="field"><label data-i18n="passwordLabel"></label><input type="password" id="loginPassword" autocomplete="current-password"></div>
      <button class="btn btn-primary" id="loginSubmitBtn" style="width:100%;" data-i18n="loginBtn"></button>
      <p class="switch-link"><span data-i18n="noAccountText"></span> <a id="showRegisterLink" data-i18n="createAccountLink"></a></p>
    </div>

    <div id="registerForm" style="display:none;">
      <h2 data-i18n="registerHeading"></h2>
      <div class="field"><label data-i18n="usernameLabel"></label><input type="text" id="regUsername" autocomplete="username"></div>
      <div class="field"><label data-i18n="displayNameLabel"></label><input type="text" id="regDisplayName"></div>
      <p class="hint" data-i18n="teamAssignedByAdminHint"></p>
      <div class="field"><label data-i18n="passwordLabel"></label><input type="password" id="regPassword" autocomplete="new-password"></div>
      <div class="field"><label data-i18n="confirmPasswordLabel"></label><input type="password" id="regPassword2" autocomplete="new-password"></div>
      <button class="btn btn-primary" id="registerSubmitBtn" style="width:100%;" data-i18n="registerBtn"></button>
      <p class="switch-link"><span data-i18n="haveAccountText"></span> <a id="showLoginLink" data-i18n="loginLink"></a></p>
    </div>

    <div id="loginFlash" class="flash"></div>
  </div>
</div>

<div id="appRoot" style="display:none;">

<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">
      <span class="logo-chip"><img id="logoTopbar" class="topbar-logo" src="" alt="Baojie Electric Motor (Thailand) logo"></span>
      <span class="brand-text">
        <span class="brand-title" data-i18n="appTitle"></span>
        <span class="brand-company">Baojie Electric Motor (Thailand)</span>
      </span>
    </span>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="entryView" data-i18n="tabEntry"></button>
      <button class="tab-btn" data-tab="dashboardView" data-i18n="tabDashboard"></button>
      <button class="tab-btn" data-tab="usersView" id="usersTabBtn" style="display:none;" data-i18n="tabUsers"></button>
      <button class="tab-btn" data-tab="authorizeView" id="authorizeTabBtn" style="display:none;" data-i18n="tabAuthorize"></button>
    </nav>
    <div class="user-info">
      <div class="lang-switcher">
        <button type="button" class="lang-btn" data-lang="th">ไทย</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="zh">中文</button>
      </div>
      <span id="currentUserLabel"></span>
      <button class="btn btn-secondary" id="logoutBtn" data-i18n="logout"></button>
    </div>
  </div>
</header>

<main class="container">

  <div id="flash" class="flash"></div>

  <!-- ENTRY VIEW -->
  <section id="entryView" class="view active">
    <h1 data-i18n="entryHeading"></h1>
    <form id="entryForm" class="card form-grid">

      <div class="field">
        <label data-i18n="reporterLabel"></label>
        <input type="text" id="reporter" required readonly>
      </div>

      <div class="field">
        <label>Team / Line *</label>
        <select id="team" required>
          <option value="" disabled selected data-i18n="teamPlaceholder"></option>
        </select>
      </div>

      <div class="field">
        <label>Date *</label>
        <input type="date" id="reportDate" required>
      </div>

      <div class="field">
        <label data-i18n="workOrderLabel"></label>
        <input type="text" id="workOrderNo" placeholder="WO-xxxx">
      </div>

      <div class="field">
        <label data-i18n="productionNoLabel"></label>
        <input type="text" id="productionNo">
      </div>

      <div class="field">
        <label data-i18n="partNoLabel"></label>
        <input type="text" id="partNo">
      </div>

      <div class="field">
        <label data-i18n="partNameLabel"></label>
        <input type="text" id="partName">
      </div>

      <div class="field">
        <label data-i18n="quantityLabel"></label>
        <input type="number" id="quantity" min="1" step="1" required placeholder="0">
      </div>

      <div class="field">
        <label data-i18n="statusLabel"></label>
        <select id="status" required>
          <option value="" disabled selected data-i18n="statusPlaceholder"></option>
        </select>
      </div>

      <div class="field field-full">
        <label data-i18n="detailLabel"></label>
        <textarea id="detail" rows="3" data-i18n-ph="detailPlaceholder"></textarea>
      </div>

      <div class="field field-full">
        <label data-i18n="photoLabel"></label>
        <div class="camera-box">
          <video id="video" autoplay playsinline style="display:none;"></video>
          <canvas id="canvas" style="display:none;"></canvas>
          <img id="preview" style="display:none;" alt="preview">
          <div class="camera-controls">
            <button type="button" id="startCamBtn" class="btn btn-secondary" data-i18n="openCameraBtn"></button>
            <button type="button" id="shotBtn" class="btn btn-secondary" disabled data-i18n="takePhotoBtn"></button>
            <button type="button" id="retakeBtn" class="btn btn-secondary" style="display:none;" data-i18n="retakeBtn"></button>
            <label class="btn btn-secondary file-label">
              <span data-i18n="mobileCaptureBtn"></span>
              <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;">
            </label>
          </div>
          <p class="hint" data-i18n="cameraHint"></p>
        </div>
      </div>

      <div class="field field-full">
        <button type="submit" class="btn btn-primary" data-i18n="submitBtn"></button>
      </div>

    </form>
  </section>

  <!-- DASHBOARD VIEW -->
  <section id="dashboardView" class="view">
    <h1 data-i18n="dashboardHeading"></h1>

    <div class="card date-filter">
      <label data-i18n="selectDateLabel"></label>
      <input type="date" id="dashDate">
      <span class="grand-total" id="grandTotalLabel"></span>
      <div class="toolbar">
        <button class="btn btn-secondary" id="exportCsvBtn">Export CSV</button>
        <button class="btn btn-secondary" id="exportExcelBtn" data-i18n="exportExcelBtn"></button>
        <button class="btn btn-secondary" id="exportJsonBtn" data-i18n="exportJsonBtn"></button>
        <label class="btn btn-secondary file-label">
          <span data-i18n="importJsonBtn"></span>
          <input type="file" id="importJsonInput" accept="application/json" style="display:none;">
        </label>
      </div>
    </div>

    <div class="card">
      <div id="lineCards" class="line-cards"></div>
    </div>

    <div class="card">
      <h2 data-i18n="chartHeading"></h2>
      <div id="barChart" class="bar-chart"></div>
    </div>

    <div class="card">
      <h2 id="tableTitle"></h2>
      <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="colTime"></th><th data-i18n="colReporter"></th><th>Team</th><th data-i18n="colWorkOrder"></th><th data-i18n="colProductionNo"></th>
            <th data-i18n="colPartNo"></th><th data-i18n="colPartName"></th><th data-i18n="colQty"></th><th data-i18n="colStatus"></th><th data-i18n="colDetail"></th><th data-i18n="colPhoto"></th><th></th>
          </tr>
        </thead>
        <tbody id="reportRows"></tbody>
      </table>
      </div>
    </div>
  </section>

  <!-- USERS VIEW (admin only) -->
  <section id="usersView" class="view">
    <h1 data-i18n="usersHeading"></h1>
    <div class="card">
      <div class="table-wrap">
      <table>
        <thead>
          <tr><th data-i18n="colUsername"></th><th data-i18n="colDisplayName"></th><th data-i18n="colDefaultTeam"></th><th data-i18n="colRole"></th><th data-i18n="colCreatedAt"></th><th></th></tr>
        </thead>
        <tbody id="userRows"></tbody>
      </table>
      </div>
    </div>
  </section>

  <!-- AUTHORIZE VIEW (admin only) -->
  <section id="authorizeView" class="view">
    <h1 data-i18n="authorizeHeading"></h1>
    <div class="card">
      <p class="hint" data-i18n="authorizeIntro"></p>
      <form id="authorizeForm" class="form-grid" style="margin-top:14px;">
        <div class="field">
          <label data-i18n="addAuthorizedUsernameLabel"></label>
          <input type="text" id="authUsername">
        </div>
        <div class="field">
          <label data-i18n="addAuthorizedNoteLabel"></label>
          <input type="text" id="authNote">
        </div>
        <div class="field">
          <label data-i18n="addAuthorizedTeamLabel"></label>
          <select id="authTeam" required><option value="" disabled selected data-i18n="teamPlaceholder"></option></select>
        </div>
        <div class="field field-full">
          <button type="submit" class="btn btn-primary" data-i18n="addBtn"></button>
        </div>
      </form>
    </div>
    <div class="card">
      <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="colUsername"></th>
            <th data-i18n="addAuthorizedNoteLabel"></th>
            <th data-i18n="colDefaultTeam"></th>
            <th data-i18n="colStatus"></th>
            <th data-i18n="colAddedAt"></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="authorizedRows"></tbody>
      </table>
      </div>
    </div>
  </section>

</main>

</div><!-- /appRoot -->

<div class="modal-overlay" id="imgModal">
  <img id="modalImg" src="" alt="photo">
</div>

<!-- Excel (.xlsx) export with embedded images; requires internet on first load -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<script>
(function () {
  "use strict";

  const LINES = ["Assembly A", "Assembly B", "Assembly C", "Stator", "Varnish Coating"];
  const STATUSES = ["NG", "Rework", "Other"];
  const STATUS_COLORS = { NG: "#e05252", Rework: "#e0a852", Other: "#8a8a8a" };

  let currentLang = localStorage.getItem(LANG_KEY) || "th";

  function T(key, vars) {
    let str = (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]);
    if (str == null) str = TRANSLATIONS.en[key];
    if (str == null) return key;
    if (vars) {
      Object.keys(vars).forEach((k) => { str = str.replace("{" + k + "}", vars[k]); });
    }
    return str;
  }

  function applyStaticTranslations() {
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = T(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
      el.placeholder = T(el.getAttribute("data-i18n-ph"));
    });
    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.lang === currentLang);
    });
    document.documentElement.lang = currentLang;
  }

  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem(LANG_KEY, lang);
    applyStaticTranslations();
    updateHeaderGreeting();
    if (currentUser) applyTeamRestriction(currentUser);
    renderDashboard();
    if (document.getElementById("usersView").classList.contains("active")) renderUsers();
    if (document.getElementById("authorizeView").classList.contains("active")) renderAuthorized();
  }

  document.querySelectorAll(".lang-btn").forEach((btn) => {
    btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
  });

  // ---------- utils ----------
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function showFlash(msg, type) {
    const el = document.getElementById("flash");
    el.textContent = msg;
    el.className = "flash flash-" + type;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3500);
  }
  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // Format an ISO timestamp as Thailand local time (Asia/Bangkok), regardless of the
  // reporting device's own timezone setting.
  function toThaiDateTimeStr(isoString) {
    if (!isoString) return "";
    const d = new Date(isoString);
    if (isNaN(d.getTime())) return "";
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Bangkok", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
    }).formatToParts(d);
    const get = (t) => (parts.find((p) => p.type === t) || {}).value || "";
    return `${get("year")}-${get("month")}-${get("day")} ${get("hour")}:${get("minute")}:${get("second")}`;
  }

  // ---------- backend API (Cloudflare Pages Functions + D1) ----------
  // All data now lives in a shared D1 database behind /api/* routes on this same
  // domain, so every device that opens this URL sees and updates the same data
  // in real time. A session token (returned by /api/login or /api/register) is
  // stored locally and sent as a Bearer token on every request.
  const SESSION_KEY = "ngReportSession";

  function getSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) { return null; }
  }
  function setSession(session) {
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  }
  function clearSession() { localStorage.removeItem(SESSION_KEY); }

  function mapApiError(code) {
    const map = {
      username_taken: "usernameTaken",
      not_authorized: "authorizeRequiredError",
      user_not_found: "userNotFound",
      wrong_password: "wrongPassword",
      missing_fields: "fillAllFields",
      password_too_short: "passwordTooShort",
      team_mismatch: "teamMismatchError",
      team_required: "teamRequiredForAuth",
      username_required: "usernameRequiredForAdd",
      already_authorized: "duplicateAuthorizeError",
      forbidden: "forbiddenError",
      unauthorized: "sessionExpiredError",
      cannot_delete_self: "cannotDeleteSelfError",
      invalid_json: "requestFailedError",
      request_failed: "requestFailedError",
      photo_too_large: "photoTooLargeError",
    };
    return T(map[code] || "requestFailedError");
  }

  async function apiFetch(path, options) {
    options = options || {};
    const session = getSession();
    const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
    if (session && session.token) headers["Authorization"] = "Bearer " + session.token;
    let res;
    try {
      res = await fetch(path, Object.assign({}, options, { headers }));
    } catch (e) {
      throw new Error(T("networkError"));
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* no/invalid body */ }
    if (!res.ok) {
      const code = (data && data.error) || "request_failed";
      throw new Error(mapApiError(code));
    }
    return data;
  }

  // ---------- reports ----------
  async function addReport(record) {
    await apiFetch("/api/reports", { method: "POST", body: JSON.stringify(record) });
  }

  async function getReportsByDate(dateStr) {
    const data = await apiFetch("/api/reports?date=" + encodeURIComponent(dateStr));
    return data.reports;
  }

  async function getAllReports() {
    const data = await apiFetch("/api/reports");
    return data.reports;
  }

  async function deleteReport(id) {
    await apiFetch("/api/reports/" + encodeURIComponent(id), { method: "DELETE" });
  }

  async function importReports(records) {
    for (const r of records) {
      const clean = Object.assign({}, r);
      delete clean.id;
      await apiFetch("/api/reports", { method: "POST", body: JSON.stringify(clean) });
    }
  }

  // ---------- users (admin) ----------
  async function getAllUsersFn() {
    const data = await apiFetch("/api/users");
    return data.users;
  }

  async function deleteUserFn(username) {
    await apiFetch("/api/users/" + encodeURIComponent(username), { method: "DELETE" });
  }

  // ---------- authorized usernames (registration allowlist, admin) ----------
  async function getAllAuthorizedFn() {
    const data = await apiFetch("/api/authorized");
    return data.authorized;
  }

  async function putAuthorizedUser(record) {
    await apiFetch("/api/authorized", {
      method: "POST",
      body: JSON.stringify({ username: record.username, note: record.note, team: record.team }),
    });
  }

  async function deleteAuthorizedFn(username) {
    await apiFetch("/api/authorized/" + encodeURIComponent(username), { method: "DELETE" });
  }

  // ---------- auth ----------
  async function registerUser({ username, password, displayName }) {
    return apiFetch("/api/register", {
      method: "POST",
      body: JSON.stringify({ username, password, displayName }),
    });
  }

  async function loginUser(username, password) {
    return apiFetch("/api/login", {
      method: "POST",
      body: JSON.stringify({ username, password }),
    });
  }

  async function fetchCurrentUser() {
    const data = await apiFetch("/api/me");
    return data.user;
  }

  tabBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      tabBtns.forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
      document.getElementById(btn.dataset.tab).classList.add("active");
      if (btn.dataset.tab === "dashboardView") renderDashboard();
      if (btn.dataset.tab === "usersView") renderUsers();
      if (btn.dataset.tab === "authorizeView") renderAuthorized();
    });
  });

  // ---------- populate selects ----------
  const teamSelect = document.getElementById("team");
  const authTeamSelect = document.getElementById("authTeam");
  LINES.forEach((l) => {
    [teamSelect, authTeamSelect].forEach((sel) => {
      const opt = document.createElement("option");
      opt.value = l; opt.textContent = l;
      sel.appendChild(opt);
    });
  });
  const statusSelect = document.getElementById("status");
  STATUSES.forEach((s) => {
    const opt = document.createElement("option");
    opt.value = s; opt.textContent = s;
    statusSelect.appendChild(opt);
  });
  document.getElementById("reportDate").value = todayStr();

  // ---------- camera ----------
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const preview = document.getElementById("preview");
  const startCamBtn = document.getElementById("startCamBtn");
  const shotBtn = document.getElementById("shotBtn");
  const retakeBtn = document.getElementById("retakeBtn");
  const fileInput = document.getElementById("fileInput");
  let stream = null;
  let currentPhotoDataUrl = "";

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      video.srcObject = stream;
      video.style.display = "block";
      preview.style.display = "none";
      shotBtn.disabled = false;
      retakeBtn.style.display = "none";
    } catch (err) {
      alert(T("cameraErrorPrefix") + err.message + ")");
    }
  }
  function stopCamera() {
    if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  }

  // Phone cameras (and some webcams) can produce native resolutions of
  // several thousand pixels per side. Sent as an uncompressed JPEG data URL,
  // that can exceed Cloudflare D1's per-value size limit and fail to save.
  // Downscale to a sane max dimension before encoding so uploads stay small
  // and fast on mobile data.
  const PHOTO_MAX_DIM = 1600;
  const PHOTO_QUALITY = 0.8;
  function scaledSize(w, h, maxDim) {
    if (w <= maxDim && h <= maxDim) return { w, h };
    const ratio = w > h ? maxDim / w : maxDim / h;
    return { w: Math.max(1, Math.round(w * ratio)), h: Math.max(1, Math.round(h * ratio)) };
  }

  function takeShot() {
    if (!video.videoWidth) return;
    const { w, h } = scaledSize(video.videoWidth, video.videoHeight, PHOTO_MAX_DIM);
    canvas.width = w;
    canvas.height = h;
    canvas.getContext("2d").drawImage(video, 0, 0, w, h);
    currentPhotoDataUrl = canvas.toDataURL("image/jpeg", PHOTO_QUALITY);
    preview.src = currentPhotoDataUrl;
    preview.style.display = "block";
    video.style.display = "none";
    retakeBtn.style.display = "inline-block";
    stopCamera();
  }
  startCamBtn.addEventListener("click", startCamera);
  shotBtn.addEventListener("click", takeShot);
  retakeBtn.addEventListener("click", () => { preview.style.display = "none"; startCamera(); });
  fileInput.addEventListener("change", () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const { w, h } = scaledSize(img.naturalWidth, img.naturalHeight, PHOTO_MAX_DIM);
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        currentPhotoDataUrl = c.toDataURL("image/jpeg", PHOTO_QUALITY);
        preview.src = currentPhotoDataUrl;
        preview.style.display = "block";
        video.style.display = "none";
        retakeBtn.style.display = "none";
        stopCamera();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  });

  function resetCameraUI() {
    currentPhotoDataUrl = "";
    preview.style.display = "none";
    preview.src = "";
    video.style.display = "none";
    retakeBtn.style.display = "none";
    shotBtn.disabled = true;
    fileInput.value = "";
    stopCamera();
  }

  // ---------- form submit ----------
  document.getElementById("entryForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const reporter = document.getElementById("reporter").value.trim();
    const team = document.getElementById("team").value;
    const reportDate = document.getElementById("reportDate").value;
    const quantity = parseInt(document.getElementById("quantity").value, 10);
    const status = document.getElementById("status").value;

    if (!reporter || !team || !reportDate || !status || !quantity || quantity < 1) {
      showFlash(T("requiredFieldsError"), "error");
      return;
    }

    // Defense in depth: even though the Team field is locked/disabled in the UI for
    // non-admins, re-check on submit in case of DOM tampering.
    if (currentUser && currentUser.role !== "admin" && team !== currentUser.team) {
      showFlash(T("teamMismatchError"), "error");
      return;
    }

    const record = {
      reporter,
      team,
      reportDate,
      workOrderNo: document.getElementById("workOrderNo").value.trim(),
      productionNo: document.getElementById("productionNo").value.trim(),
      partNo: document.getElementById("partNo").value.trim(),
      partName: document.getElementById("partName").value.trim(),
      quantity,
      status,
      detail: document.getElementById("detail").value.trim(),
      photoDataUrl: currentPhotoDataUrl || "",
      createdAt: new Date().toISOString(),
    };

    try {
      await addReport(record);
      showFlash(T("saveSuccess"), "success");
      document.getElementById("entryForm").reset();
      document.getElementById("reportDate").value = todayStr();
      if (currentUser) {
        document.getElementById("reporter").value = currentUser.displayName || "";
        applyTeamRestriction(currentUser);
      }
      resetCameraUI();
    } catch (err) {
      showFlash(T("saveErrorPrefix") + err, "error");
    }
  });

  // ---------- dashboard ----------
  const dashDate = document.getElementById("dashDate");
  dashDate.value = todayStr();
  dashDate.addEventListener("change", renderDashboard);

  async function renderDashboard() {
    const selectedDate = dashDate.value || todayStr();
    const rows = await getReportsByDate(selectedDate);

    const summary = {};
    LINES.forEach((l) => { summary[l] = { NG: 0, Rework: 0, Other: 0, total: 0, count: 0 }; });
    rows.forEach((r) => {
      if (!summary[r.team]) return;
      const st = STATUSES.includes(r.status) ? r.status : "Other";
      summary[r.team][st] += r.quantity || 0;
      summary[r.team].total += r.quantity || 0;
      summary[r.team].count += 1;
    });

    const grandQty = LINES.reduce((s, l) => s + summary[l].total, 0);
    const grandCount = LINES.reduce((s, l) => s + summary[l].count, 0);
    document.getElementById("grandTotalLabel").textContent = T("grandTotalTemplate", { count: grandCount, qty: grandQty });
    document.getElementById("tableTitle").textContent = T("tableTitleTemplate", { date: selectedDate });

    // cards
    const cardsEl = document.getElementById("lineCards");
    cardsEl.innerHTML = LINES.map((l) => {
      const s = summary[l];
      return `<div class="line-card">
        <h3>${escapeHtml(l)}</h3>
        <div class="line-total">${s.total} <span>${T("unitPieces")}</span></div>
        <div class="line-count">${T("countItemsTemplate", { count: s.count })}</div>
        <div class="status-breakdown">
          <span class="badge badge-ng">NG: ${s.NG}</span>
          <span class="badge badge-rework">Rework: ${s.Rework}</span>
          <span class="badge badge-other">Other: ${s.Other}</span>
        </div>
      </div>`;
    }).join("");

    // bar chart (pure CSS, normalized to max total across lines)
    const maxTotal = Math.max(1, ...LINES.map((l) => summary[l].total));
    const chartEl = document.getElementById("barChart");
    chartEl.innerHTML = LINES.map((l) => {
      const s = summary[l];
      const heightPct = (s.total / maxTotal) * 100;
      const segs = STATUSES.map((st) => {
        const segPct = s.total > 0 ? (s[st] / s.total) * 100 : 0;
        return `<div class="bar-seg" style="height:${segPct}%; background:${STATUS_COLORS[st]};" title="${st}: ${s[st]}"></div>`;
      }).join("");
      return `<div class="bar-col">
        <div class="bar-stack" style="height:${heightPct}%;">${segs}</div>
        <div class="bar-label">${escapeHtml(l)}<br>${s.total}</div>
      </div>`;
    }).join("");

    // table
    const tbody = document.getElementById("reportRows");
    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="12" class="empty">${T("emptyDate")}</td></tr>`;
    } else {
      tbody.innerHTML = rows.map((r) => {
        const badgeClass = "badge-" + (STATUSES.includes(r.status) ? r.status.toLowerCase() : "other");
        const photoCell = r.photoDataUrl
          ? `<img class="thumb" data-src="${r.photoDataUrl}" src="${r.photoDataUrl}" alt="photo">`
          : "";
        return `<tr>
          <td>${escapeHtml(toThaiDateTimeStr(r.createdAt))}</td>
          <td>${escapeHtml(r.reporter)}</td>
          <td>${escapeHtml(r.team)}</td>
          <td>${escapeHtml(r.workOrderNo)}</td>
          <td>${escapeHtml(r.productionNo)}</td>
          <td>${escapeHtml(r.partNo)}</td>
          <td>${escapeHtml(r.partName)}</td>
          <td>${r.quantity}</td>
          <td><span class="badge ${badgeClass}">${escapeHtml(r.status)}</span></td>
          <td>${escapeHtml(r.detail)}</td>
          <td>${photoCell}</td>
          <td><button class="btn btn-danger" data-del="${r.id}">${T("deleteBtn")}</button></td>
        </tr>`;
      }).join("");
    }

    tbody.querySelectorAll("img.thumb").forEach((img) => {
      img.addEventListener("click", () => {
        document.getElementById("modalImg").src = img.dataset.src;
        document.getElementById("imgModal").classList.add("active");
      });
    });
    tbody.querySelectorAll("button[data-del]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm(T("confirmDeleteRecord"))) return;
        await deleteReport(parseInt(btn.dataset.del, 10));
        renderDashboard();
      });
    });
  }

  document.getElementById("imgModal").addEventListener("click", () => {
    document.getElementById("imgModal").classList.remove("active");
  });

  // ---------- export / import ----------
  function downloadBlob(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById("exportCsvBtn").addEventListener("click", async () => {
    const selectedDate = dashDate.value || todayStr();
    const rows = await getReportsByDate(selectedDate);
    const header = [T("colTimeThai"), T("colReporter"), "Team", T("colWorkOrder"), T("colProductionNo"), T("colPartNo"), T("colPartName"), T("colQty"), T("colStatus"), T("colDetail")];
    const csvRows = [header.join(",")];
    rows.forEach((r) => {
      const line = [toThaiDateTimeStr(r.createdAt), r.reporter, r.team, r.workOrderNo, r.productionNo, r.partNo, r.partName, r.quantity, r.status, r.detail]
        .map((v) => `"${String(v || "").replace(/"/g, '""')}"`).join(",");
      csvRows.push(line);
    });
    downloadBlob("﻿" + csvRows.join("\n"), `ng_report_${selectedDate}.csv`, "text/csv;charset=utf-8;");
  });

  // ---------- Excel export (with embedded photos) ----------
  function dataUrlToBase64AndMime(dataUrl) {
    const match = /^data:image\/([a-zA-Z0-9.+-]+);base64,(.*)$/.exec(dataUrl || "");
    if (!match) return null;
    return { mime: match[1].toLowerCase(), base64: match[2] };
  }

  async function normalizeImageForExcel(dataUrl) {
    const parsed = dataUrlToBase64AndMime(dataUrl);
    if (parsed && ["jpeg", "jpg", "png", "gif"].includes(parsed.mime)) {
      return { base64: parsed.base64, extension: parsed.mime === "jpg" ? "jpeg" : parsed.mime };
    }
    // Re-encode anything else (e.g. webp) to JPEG via canvas so ExcelJS can embed it.
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement("canvas");
          c.width = img.naturalWidth || 1;
          c.height = img.naturalHeight || 1;
          c.getContext("2d").drawImage(img, 0, 0);
          const jpegUrl = c.toDataURL("image/jpeg", 0.85);
          const p2 = dataUrlToBase64AndMime(jpegUrl);
          if (!p2) { reject(new Error("re-encode failed")); return; }
          resolve({ base64: p2.base64, extension: "jpeg" });
        } catch (e) { reject(e); }
      };
      img.onerror = () => reject(new Error("image load failed"));
      img.src = dataUrl;
    });
  }

  document.getElementById("exportExcelBtn").addEventListener("click", async () => {
    if (typeof ExcelJS === "undefined") {
      showFlash(T("exceljsNotLoaded"), "error");
      return;
    }
    const selectedDate = dashDate.value || todayStr();
    const rows = await getReportsByDate(selectedDate);

    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet("NG Report");

    const headers = [T("colTimeThai"), T("colReporter"), "Team", T("colWorkOrder"), T("colProductionNo"), T("colPartNo"), T("colPartName"), T("colQty"), T("colStatus"), T("colDetail"), T("colPhoto")];
    ws.addRow(headers);
    ws.getRow(1).font = { bold: true };
    ws.columns = [
      { width: 20 }, { width: 16 }, { width: 14 }, { width: 14 }, { width: 14 },
      { width: 14 }, { width: 16 }, { width: 8 }, { width: 10 }, { width: 32 }, { width: 14 },
    ];

    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      const rowIndex = i + 2; // header occupies row 1
      ws.addRow([
        toThaiDateTimeStr(r.createdAt),
        r.reporter, r.team, r.workOrderNo, r.productionNo, r.partNo, r.partName,
        r.quantity, r.status, r.detail, "",
      ]);
      ws.getRow(rowIndex).height = 60;

      if (r.photoDataUrl) {
        try {
          const { base64, extension } = await normalizeImageForExcel(r.photoDataUrl);
          const imgId = wb.addImage({ base64, extension });
          ws.addImage(imgId, {
            tl: { col: 10, row: rowIndex - 1 },
            ext: { width: 70, height: 70 },
          });
        } catch (e) { /* skip embedding this image, keep the rest of the row */ }
      }
    }

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `ng_report_${selectedDate}.xlsx`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById("exportJsonBtn").addEventListener("click", async () => {
    const all = await getAllReports();
    downloadBlob(JSON.stringify(all, null, 2), `ng_report_backup_${todayStr()}.json`, "application/json");
  });

  document.getElementById("importJsonInput").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error(T("invalidFileFormat"));
        await importReports(data);
        showFlash(T("importSuccessTemplate", { n: data.length }), "success");
        renderDashboard();
      } catch (err) {
        showFlash(T("importFailPrefix") + err, "error");
      }
      e.target.value = "";
    };
    reader.readAsText(f);
  });

  // ---------- users admin tab ----------
  async function renderUsers() {
    const users = await getAllUsersFn();
    const session = getSession();
    const tbody = document.getElementById("userRows");
    if (users.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">${T("noUsers")}</td></tr>`;
      return;
    }
    tbody.innerHTML = users.map((u) => {
      const isSelf = session && session.username === u.username;
      return `<tr>
        <td>${escapeHtml(u.username)}</td>
        <td>${escapeHtml(u.displayName)}</td>
        <td>${escapeHtml(u.team || "-")}</td>
        <td>${u.role === "admin" ? T("roleAdmin") : T("roleUser")}</td>
        <td>${escapeHtml((u.createdAt || "").slice(0, 10))}</td>
        <td>${isSelf ? "" : `<button class="btn btn-danger" data-deluser="${escapeHtml(u.username)}">${T("deleteBtn")}</button>`}</td>
      </tr>`;
    }).join("");
    tbody.querySelectorAll("button[data-deluser]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm(T("confirmDeleteUserTemplate", { username: btn.dataset.deluser }))) return;
        await deleteUserFn(btn.dataset.deluser);
        renderUsers();
      });
    });
  }

  // ---------- authorize (registration allowlist) admin tab ----------
  async function renderAuthorized() {
    const list = await getAllAuthorizedFn();
    const tbody = document.getElementById("authorizedRows");
    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">${T("noAuthorized")}</td></tr>`;
      return;
    }
    tbody.innerHTML = list.map((a) => `<tr>
        <td>${escapeHtml(a.username)}</td>
        <td>${escapeHtml(a.note || "-")}</td>
        <td>${escapeHtml(a.team || "-")}</td>
        <td>${a.registered ? T("statusRegistered") : T("statusPending")}</td>
        <td>${escapeHtml((a.addedAt || "").slice(0, 10))}</td>
        <td><button class="btn btn-danger" data-revoke="${escapeHtml(a.username)}">${T("revokeBtn")}</button></td>
      </tr>`).join("");
    tbody.querySelectorAll("button[data-revoke]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm(T("confirmRevokeTemplate", { username: btn.dataset.revoke }))) return;
        await deleteAuthorizedFn(btn.dataset.revoke);
        renderAuthorized();
      });
    });
  }

  document.getElementById("authorizeForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("authUsername").value.trim();
    const note = document.getElementById("authNote").value.trim();
    const team = document.getElementById("authTeam").value;
    if (!username) { showFlash(T("usernameRequiredForAdd"), "error"); return; }
    if (!team) { showFlash(T("teamRequiredForAuth"), "error"); return; }
    try {
      await putAuthorizedUser({ username, note, team });
      showFlash(T("addAuthorizeSuccess"), "success");
      document.getElementById("authorizeForm").reset();
      renderAuthorized();
    } catch (err) {
      showFlash(err.message || String(err), "error");
    }
  });

  // ---------- login / register / session ----------
  function showLoginFlash(msg, type) {
    const el = document.getElementById("loginFlash");
    el.textContent = msg;
    el.className = "flash flash-" + type;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3500);
  }

  document.getElementById("showRegisterLink").addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registerForm").style.display = "block";
  });
  document.getElementById("showLoginLink").addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("registerForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
  });

  let currentUser = null;

  function updateHeaderGreeting() {
    if (!currentUser) return;
    document.getElementById("currentUserLabel").textContent =
      T("greetingTemplate", { name: currentUser.displayName }) + (currentUser.role === "admin" ? T("greetingAdmin") : "");
  }

  function applyTeamRestriction(user) {
    if (user.role === "admin") {
      teamSelect.disabled = false;
      return;
    }
    // Non-admin accounts may only file reports for the single Team their admin authorized.
    teamSelect.innerHTML = "";
    const opt = document.createElement("option");
    if (user.team) {
      opt.value = user.team;
      opt.textContent = user.team;
    } else {
      opt.value = "";
      opt.textContent = T("noTeamAssigned");
    }
    opt.selected = true;
    teamSelect.appendChild(opt);
    teamSelect.disabled = true;
  }

  function enterApp(user) {
    currentUser = user;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appRoot").style.display = "";
    updateHeaderGreeting();
    document.getElementById("usersTabBtn").style.display = user.role === "admin" ? "inline-block" : "none";
    document.getElementById("authorizeTabBtn").style.display = user.role === "admin" ? "inline-block" : "none";
    document.getElementById("reporter").value = user.displayName || "";
    applyTeamRestriction(user);
  }

  document.getElementById("loginSubmitBtn").addEventListener("click", async () => {
    const u = document.getElementById("loginUsername").value.trim();
    const p = document.getElementById("loginPassword").value;
    if (!u || !p) { showLoginFlash(T("fillUsernamePassword"), "error"); return; }
    try {
      const data = await loginUser(u, p);
      setSession(Object.assign({ token: data.token }, data.user));
      enterApp(data.user);
    } catch (err) {
      showLoginFlash(err.message || String(err), "error");
    }
  });

  document.getElementById("registerSubmitBtn").addEventListener("click", async () => {
    const u = document.getElementById("regUsername").value.trim();
    const dn = document.getElementById("regDisplayName").value.trim();
    const p1 = document.getElementById("regPassword").value;
    const p2 = document.getElementById("regPassword2").value;
    if (!u || !dn || !p1) { showLoginFlash(T("fillAllFields"), "error"); return; }
    if (p1.length < 4) { showLoginFlash(T("passwordTooShort"), "error"); return; }
    if (p1 !== p2) { showLoginFlash(T("passwordMismatch"), "error"); return; }
    try {
      const data = await registerUser({ username: u, password: p1, displayName: dn });
      setSession(Object.assign({ token: data.token }, data.user));
      enterApp(data.user);
    } catch (err) {
      showLoginFlash(err.message || String(err), "error");
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    try { await apiFetch("/api/logout", { method: "POST" }); } catch (e) { /* ignore, still log out locally */ }
    clearSession();
    location.reload();
  });

  // ---------- boot ----------
  applyStaticTranslations();

  (async function boot() {
    const session = getSession();
    if (session && session.token) {
      try {
        const user = await fetchCurrentUser();
        enterApp(user);
        return;
      } catch (e) { /* token expired/invalid -> fall through to login screen */ }
      clearSession();
    }
    // no valid session -> login screen stays visible (default state)
  })();
})();
</script>
